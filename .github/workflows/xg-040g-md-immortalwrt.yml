name: XG-040G-MD

run-name: "XG-040G-MD · ${{ inputs.repo_branch }} · ${{ inputs.dram_size == 'auto' && '自适应内存' || inputs.dram_size }} · ${{ inputs.extra_packages != '' && '有附加包' || '' }}${{ inputs.pkg_versions != '' && '·指定版本' || '' }}"

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '选择编译分支'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - openwrt-24.10
      dram_size:
        description: '内存上限（默认自适应，U-Boot 探测实际颗粒）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - 512M
          - 1G
          - 2G
      extra_packages:
        description: '附加软件包（空格分隔；包名前加 - 表示移除）'
        required: false
        default: ''
        type: string
      pkg_versions:
        description: '指定软件包版本（如 sing-box=1.13.19）'
        required: false
        default: ''
        type: string

env:
  DRAM_SIZE: ${{ github.event.inputs.dram_size }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
  PKG_VERSIONS: ${{ github.event.inputs.pkg_versions }}
  REPO_URL: https://github.com/openwrt/openwrt.git
  DEVICE_TARGET: airoha
  DEVICE_SUBTARGET: an7581
  CONFIG_FILE: config/xg-040g-md.config
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix libfuse-dev
        sudo -E apt -yqq autoremove --purge autoclean clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@main

    - name: Clone Source Code
      env:
        REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
        echo "SOURCE_REPO=$(echo $REPO_URL | awk -F '/' '{print $(NF)}')" >> $GITHUB_ENV

    - name: Patch DRAM Size
      if: env.DRAM_SIZE != ''
      run: |
        cd $OPENWRT_PATH
        DTS=$(grep -rl "linux,usable-memory-range" target/linux/airoha/dts/ 2>/dev/null | grep -i "xg-040g" | head -n1)
        [ -n "$DTS" ] || { echo "::error::未找到含 usable-memory-range 的 XG-040G dts"; exit 1; }
        echo "目标文件: $DTS"
        case "$DRAM_SIZE" in
          auto) MEM_SIZE=;            USABLE_SIZE=0x7fe00000 ;;
          512M) MEM_SIZE=0x20000000;  USABLE_SIZE=0x1fe00000 ;;
          1G)   MEM_SIZE=0x40000000;  USABLE_SIZE=0x3fe00000 ;;
          2G)   MEM_SIZE=0x80000000;  USABLE_SIZE=0x7fe00000 ;;
          *)    echo "::error::不支持的 DRAM_SIZE=$DRAM_SIZE"; exit 1 ;;
        esac
        python3 - "$DTS" "$MEM_SIZE" "$USABLE_SIZE" <<'PY'
        import re, sys
        path, mem, usable = sys.argv[1], sys.argv[2], sys.argv[3]
        s = open(path, encoding="utf-8").read()
        if mem:
            s, n1 = re.subn(r"(reg\s*=\s*<0x0\s+0x80000000\s+0x0\s+)0x[0-9a-fA-F]+(\s*>\s*;)",
                            lambda m: m.group(1) + mem + m.group(2), s)
            if n1 != 1:
                print("::error::memory 替换 %d 次（期望 1 次）" % n1)
                sys.exit(1)
        s, n2 = re.subn(r"(linux,usable-memory-range\s*=\s*<0x0\s+0x80200000\s+0x0\s+)0x[0-9a-fA-F]+(\s*>\s*;)",
                        lambda m: m.group(1) + usable + m.group(2), s)
        if n2 != 1:
            print("::error::usable 替换 %d 次（期望 1 次）" % n2)
            sys.exit(1)
        open(path, "w", encoding="utf-8").write(s)
        print("memory=%s usable=%s" % (mem or "（未改，交给 U-Boot fixup）", usable))
        PY
        echo "--- 修改后 ---"
        grep -nE "usable-memory-range|0x80000000|0x80200000" "$DTS"

    - name: Generate Variables
      run: |
        # 官方 OpenWrt main 分支原生支持 Nokia XG-040G-MD (UBI)
        # 其他分支回退到 bell_xg-040g-md
        case "$REPO_BRANCH" in
          main)
            CONFIG_FILE=config/xg-040g-md.config
            DEVICE_SYMBOL=nokia_xg-040g-md-ubi
            FLAVOR="ubi"
            VARIANT_LABEL="ubi"
            ;;
          *)
            CONFIG_FILE=config/xg-040g-md.config
            DEVICE_SYMBOL=bell_xg-040g-md
            FLAVOR=""
            VARIANT_LABEL="tcboot"
            echo "::warning::非 main 分支，使用 bell_xg-040g-md"
            ;;
        esac
        echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
        echo "DEVICE_SYMBOL=$DEVICE_SYMBOL" >> $GITHUB_ENV
        echo "VARIANT_LABEL=$VARIANT_LABEL" >> $GITHUB_ENV
        echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV
        echo "使用配置: $CONFIG_FILE    设备: $DEVICE_SYMBOL"

        {
          echo 'LAYOUT_NOTE<<LAYOUTEOF'
          case "$DEVICE_SYMBOL" in
            bell_xg-040g-md)
              echo "- 分区布局：bootloader 512K + env 512K + ubi 255 MB"
              echo "- 需先刷入第三方 \`tcboot.bin\` 作为引导"
              ;;
            nokia_xg-040g-md-ubi)
              echo "- **OpenWrt 官方 U-Boot 布局**：bl2 128K + ubi 255.875 MB"
              echo "- **会替换引导程序**，附件 \`preloader.bin\` 与 \`bl31-uboot.fip\` 需经 USB-TTL 刷入"
              echo "- 附件 \`*-recovery.itb\` 为 initramfs 救援镜像"
              echo "- MAC 取自 ubi 中的 \`ri\` 卷"
              echo "- **官方 OpenWrt main 分支原生支持的设备**"
              ;;
          esac
          echo LAYOUTEOF
        } >> $GITHUB_ENV

        echo "RELEASE_TAG=XG-040G-MD${FLAVOR:+-$FLAVOR}-$DRAM_SIZE-$(date +"%Y%m%d")-${{ github.run_number }}" >> $GITHUB_ENV

        if [ "$DRAM_SIZE" = "auto" ]; then
          echo "DRAM_LABEL=自适应" >> $GITHUB_ENV
        else
          echo "DRAM_LABEL=$DRAM_SIZE" >> $GITHUB_ENV
        fi

        {
          echo 'DRAM_NOTE<<DRAMNOTEEOF'
          if [ "$DRAM_SIZE" = "auto" ]; then
            echo "- **容量自适应**：U-Boot 探测实际颗粒后 fixup 进 DTB"
          else
            echo "- 本固件把系统**上限**限制在 **$DRAM_SIZE**"
          fi
          echo DRAMNOTEEOF
        } >> $GITHUB_ENV

    - name: Cache Toolchain
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}
    
    - name: Install Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Author Info
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/inject-author-info.py" "$OPENWRT_PATH"

    - name: Load Custom Configuration
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        sed -i "/^CONFIG_TARGET_airoha_an7581_DEVICE_/d" .config
        sed -i "/^# CONFIG_TARGET_airoha_an7581_DEVICE_/d" .config
        sed -i "/^CONFIG_TARGET_airoha_an7581=y/a CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_SYMBOL}=y" .config
        grep -q "^CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_SYMBOL}=y" .config \
          || { echo "::error::设备符号写入失败: $DEVICE_SYMBOL"; exit 1; }

        python3 - <<'PY'
        import os, re, sys
        raw = os.environ.get("EXTRA_PACKAGES") or ""
        add, rm, bad = [], [], []
        for t in re.split(r"[\s,]+", raw.strip()):
            if not t: continue
            neg = t.startswith("-")
            n = t[1:] if neg else t
            if not re.match(r"^[A-Za-z0-9][A-Za-z0-9._+-]*$", n):
                bad.append(t)
            elif neg:
                rm.append(n)
            else:
                add.append(n)
        if bad:
            print("::error::非法软件包名: %s" % " ".join(bad))
            sys.exit(1)
        targets = set(add) | set(rm)
        kept = []
        for ln in open(".config", encoding="utf-8").read().splitlines():
            m = re.match(r"^(?:# )?CONFIG_PACKAGE_(\S+?)(?:=[ymn]| is not set)\s*(?:#.*)?$", ln)
            if m and m.group(1) in targets:
                continue
            kept.append(ln)
        kept += ["CONFIG_PACKAGE_%s=y" % n for n in add]
        kept += ["# CONFIG_PACKAGE_%s is not set" % n for n in rm]
        open(".config", "w", encoding="utf-8").write("\n".join(kept) + "\n")
        with open(os.environ["RUNNER_TEMP"] + "/extra.sh", "w", encoding="utf-8") as f:
            f.write('export EXTRA_ADD="%s"\n' % " ".join(add))
            f.write('export EXTRA_RM="%s"\n' % " ".join(rm))
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write("EXTRA_ADD=%s\n" % " ".join(add))
            f.write("EXTRA_RM=%s\n" % " ".join(rm))
        print("附加软件包 追加: %s" % (" ".join(add) or "(无)"))
        print("附加软件包 移除: %s" % (" ".join(rm) or "(无)"))
        PY
        . "$RUNNER_TEMP/extra.sh"
        make defconfig
        grep -q "^CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_SYMBOL}=y" .config \
          || { echo "::error::defconfig 后设备符号丢失"; exit 1; }
        echo "已选定设备: $DEVICE_SYMBOL"

        python3 - <<'PY'
        import os, re, sys
        cfg = open(".config", encoding="utf-8").read()
        def state(n):
            for v in ("y", "m"):
                if re.search(r"^CONFIG_PACKAGE_%s=%s$" % (re.escape(n), v), cfg, re.M):
                    return v
            if re.search(r"^# CONFIG_PACKAGE_%s is not set$" % re.escape(n), cfg, re.M):
                return "n"
            return "?"
        fail = [n for n in os.environ.get("EXTRA_ADD", "").split() if state(n) not in ("y", "m")]
        for n in os.environ.get("EXTRA_RM", "").split():
            if state(n) in ("y", "m"):
                print("::warning::%s 被依赖，无法移除" % n)
        if fail:
            print("::error::以下附加软件包未能加入配置：")
            for n in fail:
                print("::error::  %s" % n)
            sys.exit(1)
        PY

        {
          echo 'EXTRA_NOTE<<EXTRANOTEEOF'
          if [ -n "$EXTRA_ADD" ]; then echo "- 追加：\`$EXTRA_ADD\`"; fi
          if [ -n "$EXTRA_RM" ]; then echo "- 移除：\`$EXTRA_RM\`"; fi
          if [ -z "$EXTRA_ADD$EXTRA_RM" ]; then echo "- 本次未指定附加软件包"; fi
          echo EXTRANOTEEOF
        } >> $GITHUB_ENV

    - name: Override Package Versions
      run: |
        cd $OPENWRT_PATH
        python3 - <<'PY'
        import glob, hashlib, os, re, subprocess, sys
        want = {}
        cfg = os.path.join(os.environ["GITHUB_WORKSPACE"], "config/pkg-versions.txt")
        if os.path.exists(cfg):
            for lineno, raw in enumerate(open(cfg, encoding="utf-8"), 1):
                ln = raw.split("#")[0].strip()
                if not ln: continue
                f = ln.split()
                if len(f) != 2:
                    sys.exit("::error::pkg-versions.txt 第 %d 行格式错误" % lineno)
                want[f[0]] = (f[1], "pkg-versions.txt")
        for tok in re.split(r"[\s,]+", (os.environ.get("PKG_VERSIONS") or "").strip()):
            if not tok: continue
            if tok.count("=") != 1:
                sys.exit("::error::pkg_versions 格式应为 <包名>=<版本>")
            k, v = tok.split("=")
            if k in want and want[k][0] != v:
                print("%-18s 输入覆盖文件设定（%s -> %s）" % (k, want[k][0], v))
            want[k] = (v, "本次指定")
        if not want:
            print("没有要覆盖版本的软件包")
        def sha256(path):
            h = hashlib.sha256()
            with open(path, "rb") as fp:
                for blk in iter(lambda: fp.read(1 << 20), b""):
                    h.update(blk)
            return h.hexdigest()
        done, targets = [], []
        for pkg, (ver, origin) in want.items():
            mks = glob.glob("feeds/*/*/%s/Makefile" % pkg) or glob.glob("feeds/*/*/*/%s/Makefile" % pkg)
            if not mks:
                sys.exit("::error::feeds 里找不到软件包 %s" % pkg)
            mk = mks[0]
            feed = mk.split("/")[1]
            body = open(mk, encoding="utf-8").read()
            if re.search(r"^PKG_SOURCE_PROTO:=\s*git", body, re.M):
                sys.exit("::error::%s 是 git 源，不支持" % pkg)
            m = re.search(r"^PKG_VERSION:=(.*)$", body, re.M)
            if not m or not re.search(r"^PKG_HASH:=", body, re.M):
                sys.exit("::error::%s 的 Makefile 缺少 PKG_VERSION 或 PKG_HASH" % pkg)
            cur = m.group(1).strip()
            if cur == ver:
                print("%-18s 已经是 %s，跳过" % (pkg, ver))
                continue
            print("%-18s %s -> %s" % (pkg, cur, ver))
            draft = re.sub(r"^PKG_VERSION:=.*$", "PKG_VERSION:=" + ver, body, count=1, flags=re.M)
            draft = re.sub(r"^PKG_HASH:=.*$", "PKG_HASH:=skip", draft, count=1, flags=re.M)
            open(mk, "w", encoding="utf-8").write(draft)
            target = "package/feeds/%s/%s/download" % (feed, pkg)
            before = set(os.listdir("dl")) if os.path.isdir("dl") else set()
            r = subprocess.run(["make", target, "V=s"], capture_output=True, text=True)
            if r.returncode != 0:
                sys.exit("::error::%s %s 下载失败" % (pkg, ver))
            got = [g for g in sorted(set(os.listdir("dl")) - before) if not g.endswith(".hash")]
            src = re.search(r"^PKG_SOURCE:=(.*)$", draft, re.M)
            if src:
                exp = src.group(1).strip().replace("$(PKG_NAME)", pkg).replace("$(PKG_VERSION)", ver)
                got = [g for g in got if g == exp] or got
            if len(got) != 1:
                sys.exit("::error::%s 无法确定主源码包" % pkg)
            digest = sha256(os.path.join("dl", got[0]))
            open(mk, "w", encoding="utf-8").write(
                re.sub(r"^PKG_HASH:=.*$", "PKG_HASH:=" + digest, draft, count=1, flags=re.M))
            if subprocess.run(["make", target], capture_output=True, text=True).returncode != 0:
                sys.exit("::error::%s 校验失败" % pkg)
            print("  %s  sha256=%s" % (got[0], digest))
            done.append((pkg, cur, ver, origin))
            targets.append("package/feeds/%s/%s" % (feed, pkg))
        note = ["- %s：`%s` → `%s`（%s）" % d for d in done] or ["- 本次未覆盖任何软件包版本"]
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write("PKG_VER_NOTE<<PKGVEREOF\n" + "\n".join(note) + "\nPKGVEREOF\n")
            f.write("PKG_VER_TARGETS=%s\n" % " ".join(targets))
        PY

    - name: Download DL Package
      run: |
        cd $OPENWRT_PATH
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Precompile Overridden Packages
      if: env.PKG_VER_TARGETS != ''
      run: |
        cd $OPENWRT_PATH
        echo "::group::先编内核"
        make -j$(nproc) target/linux/compile || make -j1 V=s target/linux/compile
        echo "::endgroup::"
        for t in $PKG_VER_TARGETS; do
          echo "::group::$t"
          make "$t/compile" -j$(nproc) || {
            echo "::error::$t 编译失败"
            make "$t/compile" -j1 V=s
            exit 1
          }
          echo "::endgroup::"
        done

    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -hT

    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        echo "VERSION_KERNEL=$(find -type f -name "*.manifest" -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \;)" >> $GITHUB_ENV
        cp $OPENWRT_PATH/.config build.config
        mv -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages 2>/dev/null || true
        tar -zcf Packages.tar.gz packages 2>/dev/null || true
        rm -rf packages feeds.buildinfo version.buildinfo 2>/dev/null || true
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Generate Custom Package List
      if: steps.compile.outputs.status == 'success'
      run: |
        SRC="$GITHUB_WORKSPACE/$CONFIG_FILE"
        OUT="$FIRMWARE_PATH/custom-packages.txt"
        [ -e "$SRC" ] || { echo "::error::未找到配置文件 $SRC"; exit 1; }
        {
          echo "XG-040G-MD 自定义软件包清单"
          echo "=================================================================="
          echo "固件版本 : $RELEASE_TAG"
          echo "编译分支 : $REPO_BRANCH"
          echo "内核版本 : $VERSION_KERNEL"
          echo "内存容量 : $DRAM_LABEL"
          echo "设备定义 : $DEVICE_SYMBOL"
          echo "编译时间 : $DATE"
          echo
          echo "说明"
          echo "----"
          echo "* 下列为 $CONFIG_FILE 中显式勾选的软件包"
          echo "* 依赖由 make defconfig 自动补全"
          echo "* 完整软件包列表见同目录下的 *.manifest"
          awk '
            $0 == "#" { if (pend != "") { hdr = pend; pend = "" } else { expect = 1 } next }
            expect == 1 && substr($0, 1, 2) == "# " { pend = substr($0, 3); expect = 0; next }
            {
              expect = 0
              if ($0 !~ /^CONFIG_(PACKAGE|DEFAULT)_[^=]+=y[ \t]*(#.*)?$/) next
              line = $0; comment = ""
              i = index(line, "#")
              if (i > 0) { comment = substr(line, i + 1); sub(/^[ \t]+/, "", comment); line = substr(line, 1, i - 1) }
              sub(/[ \t]+$/, "", line); sub(/=y$/, "", line); sub(/^CONFIG_PACKAGE_/, "", line); sub(/^CONFIG_DEFAULT_/, "", line)
              if (hdr != "") { printf "\n【%s】\n", hdr; hdr = ""; last = "" }
              norm = line; gsub(/-/, "_", norm)
              if (last != "" && index(norm, last "_") == 1 && substr(line, length(last) + 1, 1) == "_") {
                opt = substr(norm, length(last) + 2); sub(/^INCLUDE_/, "", opt); name = "    └ " opt
              } else { last = norm; name = "  " line }
              if (comment != "") printf "%-46s # %s\n", name, comment
              else printf "%s\n", name
            }
          ' "$SRC"
          if [ -n "$EXTRA_ADD$EXTRA_RM" ]; then
            echo
            echo "【本次构建的附加软件包】"
            for p in $EXTRA_ADD; do echo "  + $p"; done
            for p in $EXTRA_RM;  do echo "  - $p  已从基础配置中剔除"; done
          fi
          echo
          echo "使用注意"
          echo "--------"
          echo "* 默认地址: 192.168.1.1 | 默认密码: 无"
          if [ "$DRAM_SIZE" = "auto" ]; then
            echo "* 本固件内存容量自适应"
          else
            echo "* 本固件 DTS 已按 $DRAM_SIZE 写死"
          fi
        } > "$OUT"
        cat "$OUT"

    - name: Upload Firmware To Release
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.RELEASE_TAG }}
        tag: ${{ env.RELEASE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **OpenWrt Firmware for Nokia XG-040G-MD (UBI)**
          
          ### 🧠 内存容量
          ${{ env.DRAM_NOTE }}
          
          ### 📒 固件信息
          - 设备：**Nokia XG-040G-MD (UBI)** — 官方 OpenWrt 原生支持
          - 内存容量：${{ env.DRAM_LABEL }}
          - 目标分支：${{ env.REPO_BRANCH }}
